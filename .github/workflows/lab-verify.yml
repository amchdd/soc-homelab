name: Verify SOC lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test evidence boundaries and report tools
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify published snapshot integrity and source
        run: python3 scripts/triage.py --verify evidence --verify-source
      - name: Verify live endpoint, rules, collection and FIM
        run: python3 scripts/run_lab.py
      - name: Preserve current-run verification output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soc-lab-verification
          path: runtime/runs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop lab
        if: always()
        run: docker compose down
