<ossec_config>
  <client>
    <server><address>manager</address><port>1514</port><protocol>tcp</protocol></server>
    <notify_time>5</notify_time>
    <time-reconnect>10</time-reconnect>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>manager</manager_address>
      <port>1515</port>
      <agent_name>soc-endpoint</agent_name>
    </enrollment>
  </client>
  <localfile><log_format>syslog</log_format><location>/var/log/lab-auth.log</location></localfile>
  <syscheck>
    <disabled>no</disabled>
    <frequency>5</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes" realtime="yes">/lab/protected</directories>
  </syscheck>
  <rootcheck><disabled>yes</disabled></rootcheck>
  <sca><enabled>no</enabled></sca>
  <wodle name="syscollector"><disabled>yes</disabled></wodle>
  <active-response><disabled>yes</disabled></active-response>
</ossec_config>
